<!DOCTYPE html>
<html lang="ru">
<head>
  <script>window.API_BASE = '/api';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchers - eupho</title>
  
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="stylesheet" href="css/main.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    body { overflow-x: hidden; }
    .hall-intro {
      border: 1px solid var(--border-dark);
      background: #e8e3d7;
      padding: 14px;
      margin-bottom: 16px;
    }
    .hall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .mirror-door {
      aspect-ratio: 1 / 1.4;
      border: 1px solid var(--border-dark);
      background: #151412;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .mirror-door:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-color: var(--blood);
    }
    .mirror-door::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%, rgba(0,0,0,0.3) 100%);
      z-index: 2;
      pointer-events: none;
    }
    .door-avatar {
      position: absolute; inset: 8px;
      background-size: cover;
      background-position: center;
      filter: grayscale(80%) contrast(1.1) brightness(0.85);
      opacity: 0.65;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .mirror-door:hover .door-avatar {
      opacity: 1;
      filter: grayscale(20%) contrast(1.1) brightness(0.95);
    }
    .door-frame {
      position: absolute; inset: 4px;
      border: 1px solid rgba(200,200,200,0.15);
      z-index: 3;
      pointer-events: none;
    }
    .door-name {
      position: absolute; bottom: 8px; left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      color: #d8d2c6;
      font-family: "Courier New", monospace;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      z-index: 4;
      letter-spacing: 0.5px;
    }
    .door-number {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px;
      color: rgba(200,200,200,0.5);
      font-family: "Courier New", monospace;
      z-index: 4;
    }
    .door-whisper {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      color: var(--blood);
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
      padding: 4px;
      background: rgba(20,18,15,0.85);
      border: 1px solid var(--border-dark);
      max-width: 90%;
    }
    .mirror-door:hover .door-whisper { opacity: 1; }

    .watcher-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40000;
      padding: 20px;
    }
    .watcher-modal.active { display: flex; }
    .modal-card {
      background: #e8e3d7;
      border: 1px solid var(--border-dark);
      max-width: 320px;
      width: 100%;
      padding: 16px;
      text-align: center;
    }
    .modal-avatar {
      width: 120px; height: 120px;
      margin: 0 auto 12px;
      border: 1px solid var(--border-dark);
      background-size: cover;
      background-position: center;
    }
    .modal-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .modal-text { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="site">
    <div class="top-bar">
      <span data-i18n="watchersTop">the watchers hall</span>
      <div>
        <a href="index.html" data-i18n="home">Home</a>
        <a href="beats.html" data-i18n="allBeats">Beats</a>
        <a href="#" id="lang-toggle">RU</a>
      </div>
    </div>

    <header class="header">
      <div class="logo"><img class="logo-img" src="assets/1211b41172150adc0cf2b3ee449d9eaf.jpg" alt="eupho"></div>
      <div class="brand">
        <a href="index.html" class="brand-name">eupho</a>
        <div class="brand-tagline" data-i18n="watchersTagline">hall of mirrors | every watcher is a door</div>
      </div>
    </header>

    <main class="content">
      <div class="status-bar">
        <span class="live" data-i18n="watchersLive"><span class="icon-dot"></span> 10 watchers present</span>
        <span data-i18n="doNotBlink">do not blink</span>
      </div>

      <nav class="breadcrumb">
        <a href="index.html" data-i18n="home">Home</a> &gt; <a href="watchers.html" data-i18n="watchers">Watchers</a>
      </nav>

      <div class="hall-intro">
        <strong data-i18n="hallTitle">Hall of Mirrors</strong>
        <p data-i18n="hallDesc" style="margin:6px 0 0;font-size:12px;color:var(--text-dim);">
          Each door is a real person who follows this place. Hover to hear their whisper. Click to open.
        </p>
      </div>

      <div class="hall-grid" id="hall-grid"></div>
    </main>

    <footer class="footer">
      <p>В© 2011-2026 eupho // the watchers are listening</p>
    </footer>
  </div>

  <div class="watcher-modal" id="watcher-modal">
    <div class="modal-card">
      <div class="modal-avatar" id="modal-avatar"></div>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-text" id="modal-text"></div>
      <button class="btn" id="modal-close" data-i18n="close">Close</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/watchers.js"></script>
</body>
</html>
