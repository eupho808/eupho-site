<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#e8e0d8"/>
  <!-- distorted face -->
  <ellipse cx="100" cy="100" rx="70" ry="80" fill="#d4c4b8"/>
  <!-- wide smile -->
  <path d="M50,120 Q100,170 150,120 Q100,140 50,120" fill="#1a0a0a"/>
  <path d="M55,122 Q100,160 145,122" fill="#fff" opacity="0.6"/>
  <!-- eyes -->
  <ellipse cx="75" cy="85" rx="16" ry="10" fill="#0a0a0a"/>
  <ellipse cx="125" cy="85" rx="16" ry="10" fill="#0a0a0a"/>
  <circle cx="78" cy="85" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="128" cy="85" r="2" fill="#fff" opacity="0.3"/>
  <!-- cracks -->
  <path d="M30,60 L45,80 L35,95" stroke="#5a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M170,50 L155,75 L165,90" stroke="#5a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M100,25 L95,50 L105,60" stroke="#5a3a3a" stroke-width="1" fill="none"/>
  <!-- scanlines -->
  <g opacity="0.15">
    <line x1="0" y1="20" x2="200" y2="20" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="40" x2="200" y2="40" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="180" x2="200" y2="180" stroke="#000" stroke-width="1"/>
  </g>
  <!-- glitch offset -->
  <rect x="120" y="30" width="60" height="140" fill="#d4c4b8" opacity="0.5"/>
  <ellipse cx="145" cy="100" rx="55" ry="70" fill="#c4b4a8" opacity="0.4"/>
</svg>
