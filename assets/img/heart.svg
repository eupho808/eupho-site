<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="heartGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c94a4a"/>
      <stop offset="50%" stop-color="#8a1a1a"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </radialGradient>
    <filter id="wet">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  <path d="M100,180 C20,110 10,60 60,30 C85,15 100,45 100,45 C100,45 115,15 140,30 C190,60 180,110 100,180 Z" fill="url(#heartGrad)"/>
  <!-- veins -->
  <path d="M70,50 Q90,80 80,120" stroke="#4a0a0a" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M130,50 Q110,80 120,120" stroke="#4a0a0a" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M100,45 L100,130" stroke="#5a0a0a" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- wet shine -->
  <ellipse cx="75" cy="55" rx="12" ry="8" fill="#e8a0a0" opacity="0.4"/>
  <ellipse cx="125" cy="55" rx="10" ry="7" fill="#e8a0a0" opacity="0.35"/>
  <!-- dripping -->
  <path d="M95,170 Q100,185 105,170" fill="#6a1010" opacity="0.7"/>
</svg>
